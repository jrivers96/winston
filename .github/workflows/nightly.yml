name: Nightly recorded replay

on:
  schedule:
    # 08:00 UTC daily
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-recorded-replay
  cancel-in-progress: false

jobs:
  recorded-replay:
    name: Offline recorded + synthetic replay
    runs-on: ubuntu-latest
    env:
      WINSTON_OFFLINE_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Replay synthetic Supercalc case
        run: winston replay --case supercalc-late-correction --offline --format json > synthetic-report.json

      - name: Replay recorded sample bundle
        run: winston replay --bundle supercalc-stress-s2-correction --offline --format json > recorded-report.json

      - name: Maintain trust loop (no persist)
        run: winston maintain --once --profile supercalc_synthetic --no-persist --format json > maintain-report.json

      - name: Summarize results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = {
              "synthetic": json.loads(Path("synthetic-report.json").read_text()),
              "recorded": json.loads(Path("recorded-report.json").read_text()),
              "maintain": json.loads(Path("maintain-report.json").read_text()),
          }
          summary = {
              "synthetic": {
                  "passed": reports["synthetic"].get("passed"),
                  "case": reports["synthetic"].get("case"),
                  "affected_indices": reports["synthetic"].get("impact", {}).get("affected_indices"),
                  "unrelated_excluded": reports["synthetic"].get("impact", {}).get("unrelated_excluded"),
              },
              "recorded": {
                  "passed": reports["recorded"].get("passed"),
                  "case": reports["recorded"].get("case"),
                  "affected_indices": reports["recorded"].get("impact", {}).get("affected_indices"),
                  "unrelated_excluded": reports["recorded"].get("impact", {}).get("unrelated_excluded"),
              },
              "maintain": {
                  "passed": reports["maintain"].get("ok"),
                  "failed": reports["maintain"].get("failed"),
                  "unknown": reports["maintain"].get("unknown"),
                  "drafts": len(reports["maintain"].get("drafts") or []),
              },
          }
          Path("nightly-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          failed = [
              name
              for name, item in summary.items()
              if not item.get("passed")
          ]
          if failed:
              raise SystemExit(f"Nightly replay failures: {failed}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-winston-reports
          path: |
            synthetic-report.json
            recorded-report.json
            maintain-report.json
            nightly-summary.json
