name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -q --tb=short

      - name: Verify DEMO golden values
        run: |
          python - <<'PY'
          from winston.evaluation import verify_golden_values
          results = verify_golden_values()
          failed = [k for k, ok in results.items() if not ok]
          if failed:
              raise SystemExit(f"Golden value failures: {failed}")
          print("DEMO golden values OK:", results)
          PY

      - name: Verify Supercalc synthetic golden values
        run: |
          python - <<'PY'
          from winston.evaluation.supercalc import verify_supercalc_golden_values
          results = verify_supercalc_golden_values()
          failed = [k for k, ok in results.items() if not ok]
          if failed:
              raise SystemExit(f"Supercalc golden value failures: {failed}")
          print("Supercalc golden values OK:", results)
          PY

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: winston
          POSTGRES_PASSWORD: winston_dev
          POSTGRES_DB: winston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winston -d winston"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WINSTON_DATABASE_URL: postgresql://winston:winston_dev@localhost:5432/winston
      WINSTON_TEST_DATABASE_URL: postgresql://winston:winston_dev@localhost:5432/winston_test
      WINSTON_OFFLINE_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: winston_dev
        run: |
          until pg_isready -h localhost -U winston -d winston; do sleep 1; done
          psql -h localhost -U winston -d winston -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'winston_test'" \
            | grep -q 1 \
            || psql -h localhost -U winston -d winston -c "CREATE DATABASE winston_test;"

      - name: Run integration tests
        run: pytest tests/integration -q --tb=short -m integration

  offline-demo:
    name: Offline Supercalc replay
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Replay Supercalc late-correction case offline
        run: winston replay --case supercalc-late-correction --offline --format json

      - name: Replay recorded sample bundle offline
        run: winston replay --bundle supercalc-stress-s2-correction --offline --format json
