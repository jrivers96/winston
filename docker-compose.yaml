services:
  postgres:
    image: postgres:16-alpine
    container_name: winston-postgres
    environment:
      POSTGRES_USER: winston
      POSTGRES_PASSWORD: winston_dev
      POSTGRES_DB: winston
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - winston_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winston -d winston"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  winston_pgdata:
    name: winston_pgdata
