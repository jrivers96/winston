services:
  postgres:
    image: postgres:16-alpine
    container_name: winston-postgres
    environment:
      POSTGRES_USER: winston
      POSTGRES_PASSWORD: winston_dev
      POSTGRES_DB: winston
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - winston_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winston -d winston"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  winston:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: winston-dev
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
    environment:
      WINSTON_DATABASE_URL: postgresql://winston:winston_dev@postgres:5432/winston
      WINSTON_TEST_DATABASE_URL: postgresql://winston:winston_dev@postgres:5432/winston_test
      WINSTON_DATA_DIR: /workspace/.winston
      WINSTON_OFFLINE_MODE: "true"
      WINSTON_PROFILE: synthetic
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity
    # Dev Containers attach as vscode; keep interactive shells usable
    stdin_open: true
    tty: true

volumes:
  winston_pgdata:
    name: winston_pgdata
