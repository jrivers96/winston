case_id: carry_correction
title: D2 carry correction propagates through DEMO chain
description: >
  Input q on DEMO/D2 changes from 0 to 5. Level at D2 stays 102 but carry becomes 5,
  shifting D3–D5 levels and DEMO_DEPENDENT D3 from 206 to 216.
scenario: corrected
index_id: DEMO
business_date: D3
question: >
  Why did DEMO levels change after D2, and which dates and dependent indices are impacted?
ground_truth:
  root_cause: d2_q_correction
  affected_dates: [D3, D4, D5]
  affected_indices: [DEMO, DEMO_DEPENDENT]
  excluded_indices: [DEMO_UNRELATED]
  level_changes:
    DEMO:
      D2: 102
      D3: 108
      D4: 109
      D5: 110
    DEMO_DEPENDENT:
      D3: 216
  notes: D2 level unchanged; carry change drives downstream levels.
